name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
concurrency:
  group: giveaway-bot-production
  cancel-in-progress: false

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: [{"service": "bot", "target": "bot"}, {"service": "worker", "target": "worker"}, {"service": "web", "target": "web"}, {"service": "migrate", "target": "migrate"}, {"service": "db-provision", "target": "db-provision"}]
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Select registry name
        shell: bash
        run: echo "REGISTRY_REPO=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/${{ env.REGISTRY_REPO }}/${{ matrix.service }}:${{ env.DEPLOY_SHA }}
          labels: |
            org.opencontainers.image.revision=${{ env.DEPLOY_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, giveaway-bot-homelab-deploy]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Deploy verified images on homelab
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GH_TOKEN" | sudo -n /usr/bin/python3 -B /usr/local/libexec/side-projects/deploy.py giveaway-bot "$DEPLOY_SHA"
